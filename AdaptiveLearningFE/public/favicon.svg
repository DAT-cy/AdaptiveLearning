<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Graduation Cap / Learning Icon -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Cap Diamond -->
    <path d="M32 16 L51 25.5 L32 35 L13 25.5 Z" />
    <!-- Cap Base / Underneath -->
    <path d="M21 32.5 L21 42 C21 46.5 25.9 50 32 50 C38.1 50 43 46.5 43 42 L43 32.5 L32 38 Z" fill-opacity="0.95" />
    <!-- Tassel String and Bead -->
    <path d="M48 27 L48 39" stroke="#FDE047" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="48" cy="40.5" r="2" fill="#FDE047" />
  </g>

  <!-- AI Sparkle Star on top right -->
  <path d="M49 10 Q49 15 44 15 Q49 15 49 20 Q49 15 54 15 Q49 15 49 10 Z" fill="url(#sparkleGrad)" />
</svg>
