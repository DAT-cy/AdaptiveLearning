services:
  pybkt:
    build:
      context: ./pybkt
    container_name: adaptive-learning-pybkt
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      PORT: 8001
      TZ: Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.4
    container_name: adaptive-learning-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment or .env}
      MYSQL_DATABASE: adaptivelearning
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    image: gradle:8.8-jdk17
    container_name: adaptive-learning-backend
    restart: unless-stopped
    working_dir: /workspace
    command: ["gradle", "bootRun", "--no-daemon"]
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/adaptivelearning?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment or .env}
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET with at least 32 characters}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-775450545173-dg1fks5jjs667s0ek3d2lj4s5sf07si2.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AI_API_KEY: ${GEMINI_API_KEY:-${AI_API_KEY:-}}
      BKT_URL: http://pybkt:8001
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      MAIL_SMTP_CONNECTION_TIMEOUT: ${MAIL_SMTP_CONNECTION_TIMEOUT:-5000}
      MAIL_SMTP_READ_TIMEOUT: ${MAIL_SMTP_READ_TIMEOUT:-5000}
      MAIL_SMTP_WRITE_TIMEOUT: ${MAIL_SMTP_WRITE_TIMEOUT:-5000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:9090}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FREE_EXAM_LIMIT: ${FREE_EXAM_LIMIT:-5}
      PREMIUM_PRICE: ${PREMIUM_PRICE:-199000}
      PREMIUM_CURRENCY: ${PREMIUM_CURRENCY:-VND}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_BASE_URL: ${STRIPE_API_BASE_URL:-https://api.stripe.com}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_API_BASE_URL: ${PAYPAL_API_BASE_URL:-}
      CLOUDINARY_ENABLED: ${CLOUDINARY_ENABLED:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-doan}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - .:/workspace
      - gradle-cache:/home/gradle/.gradle
    depends_on:
      mysql:
        condition: service_healthy
      pybkt:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: adaptive-learning-frontend
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:9090
      VITE_API_KEY: http://localhost:9090
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-775450545173-dg1fks5jjs667s0ek3d2lj4s5sf07si2.apps.googleusercontent.com}
      VITE_BASE_URL: /
    volumes:
      - ../AdaptiveLearningFE:/app
      - frontend-node-modules:/app/node_modules

volumes:
  mysql-data:
  gradle-cache:
  frontend-node-modules:
